# Cosmic Scout — Flatpak manifest (v1.0.0 — Tuesday 3 November 2026)
#
# Runtime + PyQt BaseApp per the build that reached an AppStream-validated,
# launching state. flatlib is VENDORED into chs/flatlib (see
# chs/flatlib/VENDORED.txt) and ships with the app source — it is not a pip
# dependency. pyswisseph 2.10.3.2 is a real (compiled) dependency and is what
# the vendored flatlib calls at runtime.
#
# Both PyPI source URLs and sha256 values below are canonical sdist entries
# verified against the PyPI JSON API on 2026-07-09.
app-id: org.cosmicscout.app
runtime: org.kde.Platform
runtime-version: '5.15-24.08'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '5.15-24.08'
command: cosmicscout.sh
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # --share=network is required ONLY by the Space Weather feature, which is an
  # explicit opt-in in Settings, OFF by default. When off, the app makes no
  # network calls; when on, it contacts NOAA SWPC (services.swpc.noaa.gov) only.
  - --share=network
cleanup:
  - '/include'
  - '/lib/pkgconfig'
  - '*.la'
  - '*.a'
modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} ephem
      - pip3 install --no-index --no-build-isolation --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} pyswisseph
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/37/f0/a38e882d3c73bb8bcc37a0a27c9a7b8fceb7906312006fb03c01d0a098b3/ephem-4.2.1.tar.gz
        sha256: 920cb30369c79fde1088c2060d555ea5f8a50fdc80a9265832fd5bf195cf147f
      - type: file
        url: https://files.pythonhosted.org/packages/66/a6/db70d67a00dda42ebd033538c086879328f4c17f670eafe8aca2f11abfef/pyswisseph-2.10.3.2.tar.gz
        sha256: c54c305e83dbd5d2b71e58d8a69d8ee41de24c4d3328ce09e2af860a3537624d
  - name: cosmicscout
    buildsystem: simple
    build-commands:
      - install -Dm755 cosmicscout.sh /app/bin/cosmicscout.sh
      - mkdir -p /app/share/cosmicscout && cp -r chs /app/share/cosmicscout/chs
      - install -Dm644 flatpak/org.cosmicscout.app.desktop
          /app/share/applications/org.cosmicscout.app.desktop
      - install -Dm644 flatpak/org.cosmicscout.app.metainfo.xml
          /app/share/metainfo/org.cosmicscout.app.metainfo.xml
      - |
        for s in 16 24 32 48 64 128 256 512; do
          install -Dm644 flatpak/icons/${s}x${s}/apps/org.cosmicscout.app.png \
            /app/share/icons/hicolor/${s}x${s}/apps/org.cosmicscout.app.png
        done
    sources:
      - type: dir
        path: ..
